<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascade Arena</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f4;
      color: #232323;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f7f4;
    }

    button, input, select {
      font: inherit;
    }

    select {
      width: 100%;
      border: 1px solid #d6d3d1;
      border-radius: 7px;
      background: #fff;
      color: #292524;
      padding: 8px 10px;
      font-weight: 650;
    }

    .shell {
      width: min(1220px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 750;
    }

    .status {
      min-width: 260px;
      text-align: right;
      font-size: 15px;
      color: #57534e;
    }

    .status strong.red {
      color: #dc2626;
    }

    .status strong.blue {
      color: #2563eb;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 320px;
      gap: 24px;
      align-items: start;
    }

    .board-wrap {
      position: relative;
      width: fit-content;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 104px);
      grid-template-rows: repeat(8, 104px);
      gap: 8px;
    }

    .cell {
      width: 104px;
      height: 104px;
      border: 2px solid #22c55e;
      border-radius: 8px;
      background: #bbf7d0;
      display: grid;
      place-items: center;
    }

    .cell.clickable {
      cursor: pointer;
    }

    .cell.selected {
      border-color: #f59e0b;
      background: #fde68a;
    }

    .cell.highlight {
      border-color: #3b82f6;
      background: #bfdbfe;
    }

    .stack {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      font-size: 38px;
      font-weight: 800;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.18), 0 8px 18px rgba(0,0,0,.12);
    }

    .stack.red {
      background: linear-gradient(145deg, #ef4444, #991b1b);
    }

    .stack.blue {
      background: linear-gradient(145deg, #3b82f6, #1e40af);
    }

    .thinking {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(255,255,255,.62);
      backdrop-filter: blur(2px);
    }

    .thinking.show {
      display: grid;
    }

    .thinking-box {
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 8px;
      background: rgba(255,255,255,.95);
      padding: 14px 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,.14);
      border: 1px solid #e7e5e4;
      font-weight: 650;
      color: #292524;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid #d6d3d1;
      border-top-color: #57534e;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    aside {
      display: grid;
      gap: 14px;
    }

    .panel {
      border: 1px solid #e7e5e4;
      border-radius: 8px;
      background: #fff;
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 15px;
      line-height: 1.2;
      color: #57534e;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      color: #57534e;
      font-size: 14px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .direction-buttons {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 9px 12px;
      background: #e7e5e4;
      color: #292524;
      cursor: pointer;
      font-weight: 650;
    }

    button.primary,
    button.active {
      background: #44403c;
      color: #fff;
    }

    button.active.red {
      background: #dc2626;
      color: #fff;
    }

    button.active.blue {
      background: #2563eb;
      color: #fff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #44403c;
    }

    .eval {
      display: grid;
      grid-template-columns: var(--red, 33%) var(--draw, 34%) var(--blue, 33%);
      height: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7e5e4;
      border: 1px solid #e7e5e4;
    }

    .eval div:nth-child(1) { background: #ef4444; }
    .eval div:nth-child(2) { background: #d6d3d1; }
    .eval div:nth-child(3) { background: #3b82f6; }

    .record-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .record {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-radius: 7px;
      background: #f5f5f4;
      padding: 8px 10px;
      font-size: 13px;
      color: #57534e;
    }

    .record strong {
      color: #292524;
    }

    .log {
      max-height: 160px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #57534e;
      white-space: pre-wrap;
    }

    .error {
      display: none;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px;
      font-size: 13px;
    }

    .error.show {
      display: block;
    }

    @media (max-width: 980px) {
      .main {
        grid-template-columns: 1fr;
      }

      .board {
        grid-template-columns: repeat(8, minmax(42px, 1fr));
        grid-template-rows: repeat(8, minmax(42px, 1fr));
        gap: 5px;
        width: calc(100vw - 40px);
      }

      .cell {
        width: auto;
        height: auto;
        aspect-ratio: 1;
      }

      .stack {
        width: 68%;
        height: 68%;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>COMP30024 Cascade Arena</h1>
      <div class="status" id="status">Loading teacher model...</div>
    </header>

    <div class="main">
      <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="thinking" id="thinking">
          <div class="thinking-box">
            <div class="spinner"></div>
            <span id="thinkingText">Thinking...</span>
          </div>
        </div>
      </div>

      <aside>
        <section class="panel">
          <h2>Players</h2>
          <div class="row"><span>Red</span><select id="redPlayer"></select></div>
          <div class="row"><span>Blue</span><select id="bluePlayer"></select></div>
          <div class="row"><span>Red</span><strong id="redName">agent</strong></div>
          <div class="row"><span>Blue</span><strong id="blueName">Teacher</strong></div>
        </section>

        <section class="panel" id="humanPanel">
          <h2>Human Move</h2>
          <div class="segmented">
            <button id="moveEatMode" class="active">Move / Eat</button>
            <button id="cascadeMode">Cascade</button>
          </div>
        </section>

        <section class="panel">
          <h2>Teacher Thinking Level</h2>
          <input id="level" type="range" min="0" max="7" step="1" value="3">
          <div class="row"><span id="levelLabel">level 3</span><span id="budgetLabel">400 sims</span></div>
        </section>

        <section class="panel">
          <h2>Controls</h2>
          <button id="newGame" class="primary">New game</button>
          <button id="nextTurn">Next</button>
          <button id="undoMove">Undo</button>
          <button id="redoMove">Redo</button>
          <button id="autoPlay">Auto off</button>
          <button id="runTen">Run 10 games</button>
          <div class="row"><span>Delay</span><span>220 ms</span></div>
        </section>

        <section class="panel">
          <h2>Teacher Prediction</h2>
          <div class="eval" id="teacherEvalBar"><div></div><div></div><div></div></div>
          <div class="row">
            <span class="red">Red <strong id="teacherRedEval">33%</strong></span>
            <span>Draw <strong id="teacherDrawEval">34%</strong></span>
            <span class="blue">Blue <strong id="teacherBlueEval">33%</strong></span>
          </div>
        </section>

        <section class="panel">
          <h2>Last 10 Games</h2>
          <ul class="record-list" id="records"></ul>
        </section>

        <section class="panel">
          <h2>Move Log</h2>
          <div class="log" id="log"></div>
        </section>

        <div class="error" id="error"></div>
      </aside>
    </div>
  </div>

  <script type="module" src="/arena.js?v=5"></script>
</body>
</html>
